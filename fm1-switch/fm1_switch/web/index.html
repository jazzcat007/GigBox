<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FM-1 fleet</title>
<link rel="stylesheet" href="/style.css?v=8">
</head>
<body>

<header class="topbar">
  <h1>FM&#8209;1 fleet</h1>
  <div class="topbar-right">
    <span id="hub-badge" class="badge" title="">hub</span>
    <button id="refresh" class="ghost" title="Re-read the catalogue and library">Refresh</button>
  </div>
</header>

<main>
  <p class="note">Flashing, restoring and registering units happen on the touch panel (<a href="/">the fleet screen</a>), which names every unit by its sticker.</p>

  <!-- -------------------------------------------------------------- library -->
  <section id="library-section">
    <div class="section-head">
      <h2>On this Pi</h2>
      <span class="hint" id="library-hint"></span>
    </div>
    <div id="library" class="cards"></div>
  </section>

  <!-- ------------------------------------------------------------------ hub -->
  <section id="hub-section">
    <div class="section-head">
      <h2>Browse the hub</h2>
      <a class="hint link" href="https://thefirmwarehub.com/" target="_blank" rel="noopener">
        thefirmwarehub.com ↗
      </a>
    </div>

    <p class="note offline-note" id="offline-note" hidden></p>

    <div class="filters">
      <input id="search" type="search" placeholder="Search 277 firmwares…" autocomplete="off">
      <div id="kinds" class="chips"></div>
    </div>

    <div id="hub" class="cards"></div>
    <p class="note" id="attribution"></p>
  </section>

  <!-- --------------------------------------------------------- channel layout -->
  <section id="layout-section">
    <div class="section-head">
      <h2>Channel layout</h2>
      <span class="hint" id="layout-hint"></span>
    </div>
    <div id="layout"></div>
  </section>

  <!-- -------------------------------------------------------------- settings -->
  <section id="settings-section">
    <div class="section-head">
      <h2>Settings</h2>
      <span class="hint" id="settings-hint"></span>
    </div>
    <div id="settings"></div>
    <div class="settings-bar">
      <button id="settings-save" class="primary" disabled>Save changes</button>
      <button id="settings-discard" class="ghost" disabled>Discard</button>
    </div>
  </section>
</main>

<!-- ------------------------------------------------------------- modal -->
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>

<script src="/app.js?v=8"></script>
</body>
</html>
